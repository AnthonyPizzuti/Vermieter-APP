<div class="dashboard-container">
<header class="welcome-header">
    <div class="greeting-text prefix">
      <span *ngFor="let char of begruessungPrefix.split(''); let i = index" 
            [style.animation-delay]="(i * 50) + 'ms'">
        {{ char }}
      </span>
    </div>

    <img src="janjichausverwaltung.png" alt="Janjic Hausverwaltung" class="header-logo">

    <div class="greeting-text suffix">
      <span *ngFor="let char of begruessungSuffix.split(''); let i = index" 
            [style.animation-delay]="(begruessungPrefix.length * 50 + i * 50) + 'ms'">
        {{ char }}
      </span>
    </div>
  </header>

  <div class="haus-grid">
    <div *ngFor="let haus of haeuser" 
         class="haus-card" 
         [routerLink]="['/haus', haus.id]">
      <div class="img-placeholder">
        <img [src]="haus.bildUrl" alt="Haus Bild" *ngIf="haus.bildUrl">
        <span class="format-label" *ngIf="!haus.bildUrl">PNG</span>
      </div>
      <p class="strasse">{{ haus.strasse }}</p>
    </div>
  </div>

  <div class="admin-actions">
    <button mat-stroked-button (click)="exportiere()">Backup Download (JSON)</button>
    <input type="file" #fileInput style="display: none" (change)="importiere($event)">
    <button mat-stroked-button (click)="fileInput.click()">Daten Wiederherstellen</button>
  </div>
</div>
