<h2 mat-dialog-title>Mieter wirklich löschen?</h2>
<mat-dialog-content>
  <p>Diese Aktion kann nicht rückgängig gemacht werden. Bitte geben Sie das Administrator-Passwort ein:</p>
  
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Passwort</mat-label>
    <input matInput type="password" [(ngModel)]="password" placeholder="Passwort eingeben">
  </mat-form-field>
  
  <p *ngIf="error" style="color: red; font-size: 0.8rem;">Falsches Passwort!</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Abbrechen</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">Unwiderruflich Löschen</button>
</mat-dialog-actions>
